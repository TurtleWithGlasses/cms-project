<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CMS{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen">
    <nav class="bg-white shadow-sm px-6 py-3 flex gap-4 text-sm font-medium">
        <a href="/" class="text-blue-600 hover:underline">Home</a>
        {% if not request.cookies.get("access_token") %}
            <a href="/login" class="text-blue-600 hover:underline">Login</a>
            <a href="/register" class="text-blue-600 hover:underline">Register</a>
        {% else %}
            <a href="/api/v1/users/admin/dashboard" class="text-blue-600 hover:underline">Dashboard</a>
            <a href="/logout" class="text-blue-600 hover:underline">Logout</a>
        {% endif %}
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
